<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg-color: #f4f7f5;
            --sidebar-bg: #f9f9f9;
            --text-color: #444;
            --heading-color: #1a1a1a;
            --accent-color: #2a9d8f;
            --accent-color-light: #e9f5f4;
            --border-color: #e8e8e8;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --font-body: 'Inter', sans-serif;
            --font-heading: 'Manrope', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            font-weight: 400;
        }

        .wrapper {
            display: flex;
        }

        /* --- Sidebar --- */
        .left-sidebar {
            width: 30%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: var(--sidebar-bg);
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            z-index: 100;
        }

        .sidebar-header {
            display: flex; 
            align-items: center; 
            margin-bottom: 30px; 
        }
        .sidebar-header img {
            width: 60px; 
            height: 60px;
            border-radius: 50%; 
            margin-right: 15px; 
            border: 2px solid var(--accent-color); 
            object-fit: cover; 
        }

        .sidebar-header h1 {
            font-family: var(--font-heading);
            font-size: 1.6em; 
            font-weight: 800; 
            color: var(--heading-color);
            margin: 0; 
            line-height: 1.2;
        }

        .sidebar-header h2 {
            font-family: var(--font-body);
            font-size: 0.9em; 
            font-weight: 400; 
            color: var(--accent-color);
            margin: 0; 
            line-height: 1.2;
        }

        .lang-switcher {
            margin-bottom: 20px;
        }
